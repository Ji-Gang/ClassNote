<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课表工坊 · 课程便笺</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#303c43;font:15px/1.6 system-ui,"Microsoft YaHei UI",sans-serif}main{max-width:1100px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 16px}.muted{color:#69777c}section{background:white;border:1px solid #e0e7e2;border-radius:16px;padding:24px;margin:20px 0}input,select,button{font:inherit;border:1px solid #d5dfd8;border-radius:7px;padding:8px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e7eeeb}.primary{background:#527567;color:white;border-color:#527567}label{display:inline-flex;gap:12px;align-items:center;margin-right:20px}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #edf1ed}td input,td select{width:100%}th{font-size:13px;color:#687a80}.scroll{overflow:auto;max-height:440px}.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.times label{margin:0;font-size:13px;display:grid;grid-template-columns:44px 1fr 1fr}.times input{min-width:0;width:100%}#message{white-space:pre-line;color:#9b4c43}#summary{font-weight:600;color:#527567}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}footer{padding:20px 0;color:#69777c}code{background:#edf2ee;padding:3px 6px}
</style><main><h1>课表工坊</h1><p class="muted">从教学周到具体日期。生成课程便笺可直接导入的 CSV，数据只在当前浏览器页面处理。</p>
<section><h2>01 学期与节次</h2><label>第 1 周周一 <input type="date" id="semester"></label><p class="muted">请填写学校实际作息；不会替你猜测上课或下课时间。只需填写课程使用到的节次。</p><div id="times" class="times"></div></section>
<section><h2>02 课程安排</h2><p class="muted">周次支持：<code>1-16</code>、<code>2-16双周</code>、<code>1-15单周</code>、<code>3,7,11,15</code>。同一门课不同星期分行填写。</p><div class="scroll"><table><thead><tr><th>课程名称</th><th>星期</th><th>开始节</th><th>结束节</th><th>教学周</th><th></th></tr></thead><tbody id="rules"></tbody></table></div><div class="toolbar"><button id="add">＋ 添加课程</button><button id="load">读取配置</button><button id="saveConfig">保存配置</button><input id="configFile" type="file" accept=".json" hidden></div></section>
<section><h2>03 检查与导出</h2><p class="muted">生成后可删除调休、停课的日期；也可添加补课并修改具体日期与时间。修改课程规则后请重新生成预览。</p><div class="toolbar"><button id="generate" class="primary">生成预览</button><button id="extra">＋ 添加补课</button><button id="export" disabled>下载 CSV</button></div><p id="message" role="alert"></p><p id="summary"></p><div class="scroll"><table><thead><tr><th>日期</th><th>课程</th><th>开始</th><th>结束</th><th></th></tr></thead><tbody id="preview"></tbody></table></div></section><footer>下载后，在便笺右下角菜单选择“导入课表”。此工具生成本地课表，不会连接学校系统自动获取调课信息。</footer></main><script src="generator.js"></script></html>
